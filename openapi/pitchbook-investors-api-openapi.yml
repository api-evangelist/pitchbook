openapi: 3.2.0
info:
  title: OpenAPI definition Investors API
  version: v0
  description: Investors
servers:
- url: https://api.pitchbook.com
tags:
- name: Investors
  description: Investors
paths:
  /investors/search:
    get:
      tags:
      - Investors
      summary: Investor Search
      description: Retrieves investors matching the specified criteria
      operationId: investorSearch
      parameters:
      - name: investorNames
        in: query
        description: Accepts investor names, pbIds, websites, and tickers. Returns a list of investors that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: investorType
        in: query
        description: Investors can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Investors#INVESTOR_TYPE_TREE" target="_blank">investor type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ACINC
      - name: aum
        in: query
        description: Search for investors by their amount of assets under management. Search for investors with AUM over a certain amount using the > operator, investors with AUM under a certain amount with the < operator or investors within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: dryPowder
        in: query
        description: Find investors that have a certain amount of dry powder. Search for investors with dry powder more than an amount using the > operator, investors with dry powder less  than an amount using the < operator or investors with dry powder within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: city
        in: query
        description: Search for investors by their city location
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: stateProvince
        in: query
        description: Search for investors by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: country
        in: query
        description: Search for investors by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: postCode
        in: query
        description: Search for investors by their postcode, included to support searching for both US postal code and foreign
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: locationType
        in: query
        description: Search for investors by additional parameter specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with city, stateProvince, country, postCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: fundNames
        in: query
        description: Search for investors by their underlying funds with exact match. Accepts fund names, and pbIds. Returns a list of investors associated with that funds. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 22222-22F, Name
      - name: fundStrategy
        in: query
        description: Search for investors by the fund strategy of their underlying funds. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STRATEGY" target="_blank">fund strategy code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AN
      - name: fundSize
        in: query
        description: Search for investors by the fund size of their underlying funds. Search for funds with a larger fund size than an amount using the > operator, funds with a smaller fund size than an amount using the < operator or funds within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: fundStatus
        in: query
        description: Search for investors by the fund status of their underlying funds. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STATUS_TREE" target="_blank">fund status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: CLOS
      - name: fundDate
        in: query
        description: 'Search for investors by the date of the fund status of their underlying funds. Search for funds with a status date after a certain date using the > operator, funds with a status date after a certain date using the < operator and funds with a status date in a range using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: verticalsPreferences
        in: query
        description: Find investors by their verticals preferences. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#VERTICAL_TREE" target="_blank">vertical code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 3D
      - name: industryPreferences
        in: query
        description: Find investors by their industry preferences. Pass an <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: additionalPreferences
        in: query
        description: Find investors by <a href="https://my.pitchbook.com/api/lookup-tables/Investors#OTHER_INVESTMENT_PREFERENCES_TREE" target="_blank">additional investment preferences code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IGPS
      - name: geographicalPreferences
        in: query
        description: Find investors by their geographical preferences. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_AREA_TREE" target="_blank">area code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#UK_TERRITORY_TREE" target="_blank">territory code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#REGION_TREE" target="_blank">regions code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: UK_CI
      - name: preferredInvestmentAmount
        in: query
        description: Find investors by their preferred investment amount. Search for investors with preferred investment more than an amount using the > operator, investors with preferred investment less than an amount using the < operator or investors with preferred investment within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: preferredDealTypes
        in: query
        description: Find investors by their preferred <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_TYPE_TREE" target="_blank">deal type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: SeedA
      - name: companyNames
        in: query
        description: Find investors by the exact matched companies they have invested in. Accepts company names, pbIds, websites, and tickers. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IT
      - name: onlyMostRecentTransaction
        in: query
        description: Find investors by their most recent company transactions. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: dealType
        in: query
        description: Find investors by the types of deals and investments they have done. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_TYPE_TREE" target="_blank">deal type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: SeedA
      - name: dealStatus
        in: query
        description: Find investors by status of their past deals and investments. Distinguish between failed, upcoming, completed deals and more. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_STATUS_TREE" target="_blank">deal status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANNO
      - name: dealSize
        in: query
        description: Find investors who have done a deal of a certain size. Search for investors with a deal larger than an amount using the > operator, investors with a deal smaller than a certain amount using the < operator and investors with a deal size in a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: includeDealsWithoutDealSize
        in: query
        description: Include investors made investments without a known deal size. Set this parameter as True only when Deal Size parameter is applied. False by default
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: excludeDealsWithoutDealSize
        in: query
        description: Exclude investors made investments without a known deal size. Set this parameter as True only when Deal Size parameter is not applied. False by default
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: dealDate
        in: query
        description: 'Find investors who have had a deal within a certain time frame. Search for investors with a deal after a certain date using the > operator, investors with a deal before a certain date using the < operator and investors with a deal between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: dealIndustry
        in: query
        description: Find investors by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a> of companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: dealVerticals
        in: query
        description: Find investors by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#VERTICAL_TREE" target="_blank">vertical code</a> of companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 3D
      - name: dealIndustryAndVertical
        in: query
        description: When using both deal industry and deal vertical parameters, "OR" logic is used by default. To use "AND" logic, set this parameter to True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: dealKeywords
        in: query
        description: Find investors by the keywords of companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IT
      - name: dealCity
        in: query
        description: Find investors by the city of the companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: dealStateProvince
        in: query
        description: Find investors by the <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of the companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: dealCountry
        in: query
        description: Find investors by the <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of the companies they have invested in
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: dealPostCode
        in: query
        description: Find investors by the post code of the companies they have invested in, included to support searching for both US postal code and foreign
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: dealLocationType
        in: query
        description: Search for investors by additional parameter (related to the companies they have invested in) specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with dealCity, dealStateProvince, dealCountry, dealPostCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: limitedPartnerNames
        in: query
        description: Find investors by the exact match of limited partners invested in their funds. Accepts limited partner names, pbIds, websites, and tickers. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: currency
        in: query
        description: Specify the currency that your other parameters, such as dealSize, are entered as. It depends on the <a href="https://my.pitchbook.com/api/lookup-tables/Currency#CURRENCY_CODE_TREE" target="_blank">currency</a> in user preferences
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AFN
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: How many returned results show on page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdvancedSearchPageDtoInvestorEntityAdvancedSearchResultDto_SearchView'
      security:
      - pbToken: []
