      security:
      - pbToken: []
  /people/{pbId}/updates:
    get:
      tags:
      - People
      summary: Person Profile Updates
      description: Retrieves changes for the specific person for up to the last 90 days
      operationId: getPersonUpdates
      parameters:
      - name: pbId
        in: path
        description: Person pbId. Required to specify time period using 'sinceDate' or 'trailingRange' parameter
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          12406-06P:
            summary: 12406-06P
            value: 12406-06P
          11617-93P:
            summary: 11617-93P
            value: 11617-93P
          12024-82P:
            summary: 12024-82P
            value: 12024-82P
          12382-57P:
            summary: 12382-57P
            value: 12382-57P
          12327-94P:
            summary: 12327-94P
            value: 12327-94P
      - name: sinceDate
        in: query
        description: 'Add this parameter to extract information about the entity updates after a certain date with the > operator, before a certain date with the < operator and between 2 dates with the ^ operator. Set this parameter in pair with pbId. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: trailingRange
        in: query
        description: Add this parameter to extract information about the entity updates during last N days (up to 90). Set this parameter in pair with pbId
        required: false
        style: form
        explode: true
        schema:
          type: integer
        example: '20'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UpdateDto'
      security:
      - pbToken: []
components:
  schemas:
    CompanyRoleDto:
      type: object
      properties:
        companyId:
          type: string
          example: 10352-44
        companyName:
          type: string
          example: Herbert Smith Freehills
        position:
          type: string
          example: Partner
        positionType:
          type: string
          example: Employee
        positionStatus:
          type: string
          example: Current
        positionStart:
          type: string
          format: date
          example: '2011-05-01'
        positionFinish:
          type: string
          format: date
          example: '2015-05-01'
    PersonNameDto:
      type: object
      properties:
        full:
          type: string
          example: John Taylor
        first:
          type: string
          example: John
        last:
          type: string
          example: Taylor
        middle:
          type: string
          example: M.
        prefix:
          type: string
          example: Mr.
        suffix:
          type: string
          example: JD
    DealRoleDto:
      type: object
      properties:
        dealId:
          type: string
          example: 120048-04T
        dealDate:
          type: string
          format: date
          example: '2019-01-08'
        companyId:
          type: string
          example: 12774-34
        companyName:
          type: string
          example: Synamedia
        representingId:
          type: string
          example: 10352-44
        representingName:
          type: string
          example: Herbert Smith Freehills
    DuplicatedItemDto:
      type: object
      properties:
        id:
          type: string
          example: 420962-68
        occurrence:
          type: integer
          format: int32
          example: 1
    FailedItemDto:
      type: object
      properties:
        id:
          type: string
          example: 420962-68
        reason:
          type: string
          example: 429 TOO_MANY_REQUESTS
          enum:
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 429 TOO_MANY_REQUESTS
          - 500 INTERNAL_SERVER_ERROR
          - 503 SERVICE_UNAVAILABLE
        message:
          type: string
          example: '{LIMIT_TYPE} rate limit exceeded. Please wait until rate limit period is renewed'
    DictionaryDto:
      type: object
      properties:
        code:
          type: string
          example: Dictionary code
        description:
          type: string
          example: Dictionary Code Description
    BulkRequestDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItemDto'
    BulkResultDtoPersonBioDto:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/BulkStatsDto'
        matched:
          type: array
          items:
            $ref: '#/components/schemas/PersonBioDto'
        noData:
          type: array
          items:
            $ref: '#/components/schemas/NoDataItemDto'
        unmatched:
          type: array
          items:
            $ref: '#/components/schemas/FailedItemDto'
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicatedItemDto'
    NoDataItemDto:
      type: object
      properties:
        id:
          type: string
    BulkStatsDto:
      type: object
      properties:
        total:
          type: integer
          format: int32
        matched:
          type: integer
          format: int32
        noData:
          type: integer
          format: int32
        unmatched:
          type: integer
          format: int32
        duplicates:
          type: integer
          format: int32
    PersonEducationWorkDto:
      type: object
      properties:
        personId:
          type: string
          example: 195066-01P
        fullName:
          type: string
          example: John Taylor
        education:
          type: array
          items:
            $ref: '#/components/schemas/PersonEducationInfoDto'
        companyRoles:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRoleDto'
        boardSeats:
          type: array
          items:
            $ref: '#/components/schemas/BoardSeatDto'
        currentAdvisoryRoles:
          type: array
          items:
            $ref: '#/components/schemas/CurrentAdvisoryRoleDto'
        dealRoles:
          type: array
          items:
            $ref: '#/components/schemas/DealRoleDto'
        fundRoles:
          type: array
          items:
            $ref: '#/components/schemas/FundRoleDto'
    PersonEducationInfoDto:
      type: object
      properties:
        institution:
          type: string
          example: University of Chicago Law School
        degree:
          type: string
          example: Graduate
        yearOfGraduation:
          type: integer
          format: int32
          example: 2006
    UpdateDto:
      type: object
      properties:
        updates:
          type: object
          additionalProperties:
            type: string
            example: '{"Endpoint name":"Update Status (true/false)"}'
          example:
            Endpoint name: Update Status (true/false)
    PersonBioDto:
      type: object
      properties:
        personId:
          type: string
          example: 195066-01P
        personName:
          $ref: '#/components/schemas/PersonNameDto'
        yearOfBirth:
          type: integer
          format: int32
          example: 1970
        biography:
          type: string
          example: Mr. John Taylor serves as Partner at Herbert Smith Freehills. He helps clients achieve the best outcome on private equity investments, including private equity real estate, infrastructure and energy. He works with investors, corporates and management teams on significant and high-profile transactions, including UK and international buyouts, mergers, acquisitions, disposals, takeovers, joint ventures, equity financing and management equity incentives. The focus of John's work is acting for private equity funds on investments and disposals. John also brings his investor-side experience to bear in acting for management teams and investee companies in relation to private equity investments.
        linkedInProfileUrl:
          type: string
