openapi: 3.2.0
info:
  title: OpenAPI definition People API
  version: v0
  description: People
servers:
- url: https://api.pitchbook.com
tags:
- name: People
  description: People
paths:
  /people/search:
    get:
      tags:
      - People
      summary: People Search
      description: Retrieves people along with the companies associated with the person
      operationId: peopleSearch
      parameters:
      - name: firmNames
        in: query
        description: Accepts firm names, pbIds, websites, and tickers. Returns a list of persons from all entities that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: personNames
        in: query
        description: Accepts person names, and pbIds. Returns a list of persons that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: biography
        in: query
        description: Search for people by words and phrases in their biography text
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IT
      - name: university
        in: query
        description: Find people by their graduating institution
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: MIT
      - name: firmType
        in: query
        description: Find people associated with a specific <a href="https://my.pitchbook.com/api/lookup-tables/People#PERSON_FIRM_TYPE_TREE" target="_blank">firm type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: SP_AC
      - name: positionLevel
        in: query
        description: Find people by their <a href="https://my.pitchbook.com/api/lookup-tables/People#PERSON_POSITION_TREE" target="_blank">position level code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AC
      - name: positionTitle
        in: query
        description: Find people by the keywords related to their positions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Chief Executive Officer
      - name: primaryPositionOnly
        in: query
        description: Search for people by additional parameter concerning their positions. Set this parameter as True and use in pair with positionTitle option
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: department
        in: query
        description: Find people within an organization by the department they work in. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/People#PERSON_POSITION_DEPARTMENT_TREE" target="_blank">position department code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ACC
      - name: status
        in: query
        description: Find people by position status (active or former)
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: active
      - name: gender
        in: query
        description: 'Find people by gender (male or female) '
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: male
      - name: industry
        in: query
        description: People can be found by <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a> of the companies associated with them
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: verticals
        in: query
        description: People can be found by <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#VERTICAL_TREE" target="_blank">vertical code</a> of the companies associated with them
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 3D
      - name: industryAndVertical
        in: query
        description: When using both industry and vertical parameters, "OR" logic is used by default. To use "AND" logic, set this parameter to True. Set this parameter in pair with industry and vertical options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: city
        in: query
        description: Search for people by city of their entities
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: stateProvince
        in: query
        description: Search for people by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of their entities
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: country
        in: query
        description: Search for people by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of their entities
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: postCode
        in: query
        description: Search for people by postcodes of their entities
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: locationType
        in: query
        description: Search for people by additional parameter concerning the entities specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with city, stateProvince, country, postCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: firstName
        in: query
        description: Find people by first name
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: John
      - name: lastName
        in: query
        description: Find people by last name
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Johnson
      - name: email
        in: query
        description: Find people by email
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Johnson@pitchbook.com
      - name: domain
        in: query
        description: Find people by domain
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: pitchbook.com
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: How many returned results show on page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdvancedSearchPageDtoPersonAdvancedSearchResultDto_SearchView'
      security:
      - pbToken: []
  /people/{pbId}/bio:
    get:
      tags:
      - People
      summary: People Bio
      description: Retrieves key data points about specific person
      operationId: getPerson
      parameters:
