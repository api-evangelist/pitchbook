        in: path
        description: Person pbId
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          11436-22P:
            summary: 11436-22P
            value: 11436-22P
          12260-62P:
            summary: 12260-62P
            value: 12260-62P
          12330-19P:
            summary: 12330-19P
            value: 12330-19P
          11429-47P:
            summary: 11429-47P
            value: 11429-47P
          12369-25P:
            summary: 12369-25P
            value: 12369-25P
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonBioDto'
      security:
      - pbToken: []
  /people/bio:
    post:
      tags:
      - People
      summary: '[Bulk] People Bio'
      description: Retrieves key data points about specific person. This bulk call allows you to send multiple pbIds within a single API call.
      operationId: getBulkPersonBio
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequestDto'
            example:
              items:
              - id: 11425-78P
              - id: 12251-53P
              - id: 11396-89P
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BulkResultDtoPersonBioDto'
      security:
      - pbToken: []
  /people/{pbId}/education-work:
    get:
      tags:
      - People
      summary: People Education/Work
      description: Retrieves company, deal, fund and advisory roles of the specific person
      operationId: getPersonEducationWork
      parameters:
      - name: pbId
        in: path
        description: Person pbId
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          11396-89P:
            summary: 11396-89P
            value: 11396-89P
          11396-98P:
            summary: 11396-98P
            value: 11396-98P
          11397-70P:
            summary: 11397-70P
            value: 11397-70P
          12382-57P:
            summary: 12382-57P
            value: 12382-57P
          12369-25P:
            summary: 12369-25P
            value: 12369-25P
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonEducationWorkDto'
      security:
      - pbToken: []
  /people/{pbId}/contact:
    get:
      tags:
      - People
      summary: People Contact
      description: Retrieves contact information of the specific person
      operationId: getPersonContactInfo
      parameters:
      - name: pbId
        in: path
        description: Person pbId
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          11406-88P:
            summary: 11406-88P
            value: 11406-88P
          11428-93P:
            summary: 11428-93P
            value: 11428-93P
          11461-96P:
            summary: 11461-96P
            value: 11461-96P
          11429-47P:
            summary: 11429-47P
            value: 11429-47P
          11441-53P:
            summary: 11441-53P
            value: 11441-53P
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
