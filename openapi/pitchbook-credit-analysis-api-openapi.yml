  /credit-analysis/credit-news/{articleId}/attachment:
    get:
      tags:
      - Credit Analysis
      summary: Credit News Attachment
      description: Retrieves an exact attachment file for a specific article.
      operationId: downloadAttachment
      parameters:
      - name: articleId
        in: path
        description: News articleId
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        examples:
          '2142401':
            summary: '2142401'
            value: 2142401
          '5312405':
            summary: '5312405'
            value: 5312405
          '1312103':
            summary: '1312103'
            value: 1312103
          '6052303':
