            value: 6062401
          '5302402':
            summary: '5302402'
            value: 5302402
          '5312104':
            summary: '5312104'
            value: 5312104
      - name: name
        in: query
        description: Attachment Name
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
