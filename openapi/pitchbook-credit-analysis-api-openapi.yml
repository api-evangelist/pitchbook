        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditNewsDto'
      security:
      - pbToken: []
  /credit-analysis/credit-news:
    post:
      tags:
      - Credit Analysis
      summary: '[Bulk] Credit News'
      description: Returns whole information about the specified Credit News articles. This bulk call allows you to send multiple articleIds within a single API call
      operationId: getBatchCreditNews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNewsBulkRequestDto'
            example:
              items:
              - articleId: 11041384
              - articleId: 2142401
              - articleId: 5302402
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
