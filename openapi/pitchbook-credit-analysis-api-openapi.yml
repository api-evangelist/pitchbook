openapi: 3.2.0
info:
  title: OpenAPI definition Credit Analysis API
  version: v0
  description: Credit Analysis
servers:
- url: https://api.pitchbook.com
tags:
- name: Credit Analysis
  description: Credit Analysis
paths:
  /credit-analysis/credit-news/search:
    get:
      tags:
      - Credit Analysis
      summary: Credit News Search
      description: Retrieves main info about the Credit news articles matching the specified criteria
      operationId: creditNewsSearch
      parameters:
      - name: authors
        in: query
        description: Articles can be found by their authors. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: John Atkins, Glen Fest
      - name: regions
        in: query
        description: Search for articles by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit News#CREDIT_NEWS_REGION" target="_blank">regions</a> covered in them. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Europe, United States
      - name: assetClasses
        in: query
        description: Search for articles by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit News#CREDIT_NEWS_ASSET_CLASS" target="_blank">asset classes</a> covered in them. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: CLO, Bonds
      - name: topics
        in: query
        description: Articles can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Credit News#CREDIT_NEWS_TOPIC" target="_blank">topics</a>. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ' People, Trends'
      - name: issuer
        in: query
        description: Accepts issuer names, pbIds, websites, and tickers. Returns a list of entities that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Tesla
      - name: lender
        in: query
        description: Accepts lender names, pbIds, websites, and tickers. Returns a list of entities that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Tesla
      - name: sponsor
        in: query
        description: Accepts sponsor names, pbIds, websites, and tickers. Returns a list of entities that are an exact match. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Tesla
      - name: sinceDate
        in: query
        description: Add this parameter to extract news articles published after a certain date with the > operator, before a certain date with the < operator and between two dates with the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2023-07-20
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page. If nothing is specified, default value is 1.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: Set how many returned results will be shown on the page (between 1 and 250). If nothing is specified, default value is 25.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditNewsSearchPageDto'
      security:
      - pbToken: []
  /credit-analysis/credit-news/most-recent:
    get:
      tags:
      - Credit Analysis
      summary: Most Recent Credit News
      description: Retrieves up to 250 of the most recently published articles and their associated descriptions (excluding article content). Users can specify page number parameter to retrieve older articles.
      operationId: getMostRecentCreditNews
      parameters:
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 1
      - name: perPage
        in: query
        description: How many returned results show on the page
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
        example: 25
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MostRecentCreditNewsDto'
      security:
      - pbToken: []
