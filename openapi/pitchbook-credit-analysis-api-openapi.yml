        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        default:
          description: default response
          content:
            '*/*':
              schema:
                type: string
                example: Binary file content
      security:
      - pbToken: []
  /credit-analysis/credit-research/search:
    get:
      tags:
      - Credit Analysis
      summary: Credit Research Search
      description: Retrieves main info about the Credit Research reports matching the specified criteria
      operationId: creditResearchSearch
      parameters:
      - name: authors
        in: query
        description: Reports can be found by their authors. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Jack Jonson
      - name: regions
        in: query
        description: Search for reports by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_REGION" target="_blank">regions</a> covered in them. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: United States
      - name: assetClasses
        in: query
        description: Search for reports by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_ASSET_CLASS" target="_blank">asset classes</a> covered in them. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Bonds
      - name: reportTypes
        in: query
        description: Reports can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_REPORT_TYPE" target="_blank">report types</a>. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Snapshot
      - name: marketTypes
        in: query
        description: Search for reports by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_MARKET_TYPE" target="_blank">market types</a> covered in them. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Primary Market
      - name: companyNames
        in: query
        description: Accepts company names, pbIds, websites, and tickers. Returns a list of companies that are an exact match. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Aris Mining, 432919-99
      - name: purposes
        in: query
        description: Search for reports by the <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_PURPOSE" target="_blank">purposes</a> covered in them. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: M&A
      - name: fileTypes
        in: query
        description: Reports can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Credit Research#CREDIT_RESEARCH_FILE_TYPE" target="_blank">file types</a>. Use a comma to separate multiple values.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: PDF
      - name: sinceDate
        in: query
        description: Add this parameter to extract reports published after a certain date with the > operator, before a certain date with the < operator and between two dates with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>2024-04-26'
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page. If nothing is specified, default value is 1.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: Set how many returned results will be shown on the page (between 1 and 250). If nothing is specified, default value is 25.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '50'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
