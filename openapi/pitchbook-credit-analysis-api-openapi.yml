        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditResearchPageDto'
      security:
      - pbToken: []
  /credit-analysis/credit-research/{reportId}/download:
    get:
      tags:
      - Credit Analysis
      summary: Credit Research Download
      description: Retrieves an exact file of a specific report.
      operationId: creditResearchDownload
      parameters:
      - name: reportId
        in: path
        description: Report ID
        required: true
        style: simple
        explode: false
