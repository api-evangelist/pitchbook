openapi: 3.2.0
info:
  title: OpenAPI definition Limited Partners API
  version: v0
  description: Limited Partners
servers:
- url: https://api.pitchbook.com
tags:
- name: Limited Partners
  description: Limited Partners
paths:
  /limited-partners/search:
    get:
      tags:
      - Limited Partners
      summary: Limited Partner Search
      description: Retrieves limited partners matching the specified criteria
      operationId: limitedPartnerSearch
      parameters:
      - name: limitedPartnerNames
        in: query
        description: Accepts limited partner names, pbIds, websites, and tickers. Returns a list of limited partners that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: limitedPartnerType
        in: query
        description: Limited partners can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Limited Partners#LP_TYPE_TREE" target="_blank">limited partner type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: BI
      - name: city
        in: query
        description: Search for limited partners by their city location
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: stateProvince
        in: query
        description: Search for limited partners by their <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: country
        in: query
        description: Search for limited partners by their <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: postCode
        in: query
        description: Search for limited partners by their postcode, included to support searching for both US postal code and foreign
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: locationType
        in: query
        description: Search for limited partners by additional parameter specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with city, stateProvince, country, postCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: aum
        in: query
        description: Search for limited partners by their amount of assets under management. Search for limited partners with AUM over a certain amount using the > operator, limited partners with AUM under a certain amount with the < operator or limited partners within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: numberOfCommitments
        in: query
        description: Search for limited partners by their count of commitments. Search for limited partners with commitments over a certain count using the > operator, limited partners with commitments under a certain count with the < operator or limited partners within a range using the ^ operator. Counts in units
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <10
      - name: commitmentDate
        in: query
        description: 'Search for limited partners by their commitments date. Search for limited partners with commitments after a certain date using the > operator, limited partners with commitments before a certain date using the < operator or limited partners with commitments between 2 dates within a range using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: commitmentSize
        in: query
        description: Search for limited partners by their commitments of a certain size. Search for limited partners with commitments larger than an amount using the > operator, limited partners with commitments smaller than a certain amount using the < operator or limited partners within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: fundStateProvince
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of committed funds
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: fundCountry
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of committed funds
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: fundStrategy
        in: query
        description: Search for limited partners by the fund strategy of committed funds. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STRATEGY" target="_blank">fund strategy code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AN
      - name: mandateKeywords
        in: query
        description: Search for limited partners by keywords they are associated with mandates
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IT
      - name: mandateStatusCurrent
        in: query
        description: Search for limited partners that have current mandates. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: mandateStatusFormer
        in: query
        description: Search for limited partners that have former mandates. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: mandateAmount
        in: query
        description: Search for limited partners by their mandates of a certain size. Search for limited partners with mandates larger than an amount using the > operator, limited partners with mandates smaller than a certain amount using the < operator or limited partners within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: mandateStartDate
        in: query
        description: 'Search for limited partners by start date of mandates. Search for limited partners with mandates after a certain start date using the > operator, limited partners with mandates before a certain start date using the < operator or limited partners with mandates between 2 start dates within a range using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '2022-10-20'
      - name: mandateEndDate
        in: query
        description: 'Search for limited partners by end date of mandates. Search for limited partners with mandates after a certain end date using the > operator, limited partners with mandates before a certain end date using the < operator or limited partners with mandates between 2 end dates within a range using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '2022-10-30'
      - name: mandateStateProvince
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of mandates
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: mandateCountry
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of mandates
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: fundStrategyFocus
        in: query
        description: Search for limited partners by the targeted fund strategy of committed mandates. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STRATEGY" target="_blank">fund strategy code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AN
      - name: fundManagerFocus
        in: query
        description: Search for limited partners by the manager preferences of committed mandates. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Limited Partners#FUND_MANAGER_FOCUS_TREE" target="_blank">fund manager focus code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: EM
      - name: assetTypes
        in: query
        description: Search for limited partners by the allocation of assets. Pass an <a href="https://my.pitchbook.com/api/lookup-tables/Limited Partners#ASSET_TYPE_TREE" target="_blank">asset type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ALT
      - name: currentlyAllocated
        in: query
        description: Search for limited partners by the current specific assets of a certain size. Search for limited partners with current specific assets larger than an amount using the > operator, limited partners with current specific assets smaller than a certain amount using the < operator or limited partners with current specific assets within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: currentlyAllocatedPercent
        in: query
        description: Search for limited partners by the percent of current specific assets. Search for limited partners with the percent of current specific assets larger than a percent using the > operator, limited partners with the percent of current specific assets smaller than a percent using the < operator or limited partners with the percent of current specific assets within a range using the ^ operator. Values in percents
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: targetedMin
        in: query
        description: Search for limited partners by the minimum values of targeted specific assets of a certain size. Search for limited partners with the minimum values of targeted specific assets larger than an amount using the > operator, limited partners with the minimum values of targeted current specific assets smaller than a certain amount using the < operator or limited partners with the minimum values of targeted current specific assets within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: targetedMax
        in: query
        description: Search for limited partners by the maximum values of targeted specific assets of a certain size. Search for limited partners with the maximum values of targeted specific assets larger than an amount using the > operator, limited partners with the maximum values of targeted current specific assets smaller than a certain amount using the < operator or limited partners with the maximum values of targeted current specific assets within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: targetedMinPercent
        in: query
        description: Search for limited partners by the minimum percent of targeted specific assets. Search for limited partners with the the minimum percent of targeted specific assets larger than a percent using the > operator, limited partners with the minimum percent of targeted specific assets smaller than a percent using the < operator or limited partners with the minimum percent of targeted specific assets within a range using the ^ operator. Values in percents
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: targetedMaxPercent
        in: query
        description: Search for limited partners by the maximum percent of targeted specific assets. Search for limited partners with the the maximum percent of targeted specific assets larger than a percent using the > operator, limited partners with the maximum percent of targeted specific assets smaller than a percent using the < operator or limited partners with the maximum percent of targeted specific assets within a range using the ^ operator. Values in percents
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: commitmentFundIndustryFocus
        in: query
        description: Search for limited partners by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a> of committed funds
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: commitmentFundVintageYear
        in: query
        description: Search for limited partners by the vintage year of committed funds. Search for limited partners with fund's vintage year after a certain date using the > operator, limited partners with fund's vintage year before a certain date using the < operator and limited partners with fund's vintage year between 2 dates using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>2021'
      - name: commitmentFundSize
        in: query
        description: Search for limited partners by the committed funds of a certain size. Search for limited partners with the committed funds larger than an amount using the > operator, limited partners with the committed funds smaller than a certain amount using the < operator or limited partners with the committed funds within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <10
      - name: commitmentFundStrategyPreferences
        in: query
        description: Search for limited partners by the fund strategy of preferred funds. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STRATEGY" target="_blank">fund strategy code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AN
      - name: commitmentFundStateProvincePreferences
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of preferred funds
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: commitmentFundCountryPreferences
        in: query
        description: Search for limited partners by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of preferred funds
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: currency
        in: query
        description: ''
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AFN
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: How many returned results show on page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdvancedSearchPageDtoLimitedPartnerAdvancedSearchResultDto_SearchView'
      security:
      - pbToken: []
