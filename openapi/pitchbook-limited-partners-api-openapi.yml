components:
  schemas:
    LimitedPartnerBioDto:
      type: object
      properties:
        limitedPartnerId:
          type: string
          example: 11231-47
        limitedPartnerName:
          $ref: '#/components/schemas/EntityNameDto'
        hqLocation:
          $ref: '#/components/schemas/HqLocationDto'
        description:
          type: string
          example: Landmark Partners is a private equity, real estate and infrastructure investment company specializing in secondary funds. The firm invests primarily as a fund of funds, purchasing interests in various investment funds, typically structured as limited partnerships. Landmark acquires limited partnership interests and direct investments in real asset, venture, mezzanine, and buyout assets. Founded in 1989, Landmark is headquartered in Simsbury, Connecticut, and has offices in Boston, Dallas, New York, and London.
        limitedPartnerTypes:
          type: array
          example:
            type:
              code: F
              description: Founded
            primary: true
          items:
            $ref: '#/components/schemas/EntityTypeDto'
        assetsUnderManagement:
          $ref: '#/components/schemas/MoneyDto'
        yearFounded:
          type: integer
          format: int32
          example: 1989
        website:
          type: string
          example: www.landmarkpartners.com
        managementStaff:
          type: integer
          format: int32
    MoneyDto:
      type: object
      properties:
        amount:
          type: number
          example: 17039.27
        currency:
          type: string
          example: USD
        nativeAmount:
          type: number
          example: 15689
        nativeCurrency:
          type: string
          example: EUR
        estimated:
          type: boolean
          example: false
    FailedItemDto:
      type: object
      properties:
        id:
          type: string
          example: 420962-68
        reason:
          type: string
          example: 429 TOO_MANY_REQUESTS
          enum:
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 429 TOO_MANY_REQUESTS
          - 500 INTERNAL_SERVER_ERROR
          - 503 SERVICE_UNAVAILABLE
        message:
          type: string
          example: '{LIMIT_TYPE} rate limit exceeded. Please wait until rate limit period is renewed'
    LimitedPartnerCommitmentDetailedDto:
      type: object
      properties:
        limitedPartnerId:
          type: string
          example: 11231-47
        committedFundId:
          type: string
          example: 59007-79F
        committedFundName:
          type: string
          example: Pension Benefit Guaranty
        committedInvestors:
          type: array
          items:
            $ref: '#/components/schemas/CommittedInvestorDto'
        commitmentDate:
          type: string
          format: date
          example: '2015-10-08'
        commitmentSize:
          $ref: '#/components/schemas/MoneyDto'
        commitmentStatus:
          $ref: '#/components/schemas/DictionaryDto'
        commitmentType:
          $ref: '#/components/schemas/DictionaryDto'
    BulkResultDtoLimitedPartnerTargetAllocationsDto:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/BulkStatsDto'
        matched:
          type: array
          items:
            $ref: '#/components/schemas/LimitedPartnerTargetAllocationsDto'
        noData:
          type: array
          items:
            $ref: '#/components/schemas/NoDataItemDto'
        unmatched:
          type: array
          items:
            $ref: '#/components/schemas/FailedItemDto'
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicatedItemDto'
    LimitedPartnerActualAllocationsDto:
      type: object
      properties:
        limitedPartnerId:
          type: string
          example: 11231-47
        limitedPartnerName:
          type: string
          example: Cooley
        affiliatedFunds:
          type: integer
          format: int32
          example: 10
        affiliatedInvestors:
          type: integer
          format: int32
          example: 15
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationDto'
    NoDataItemDto:
      type: object
      properties:
        id:
          type: string
    DuplicatedItemDto:
      type: object
      properties:
        id:
          type: string
          example: 420962-68
        occurrence:
          type: integer
          format: int32
          example: 1
    RangeDtoMoneyDto:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/MoneyDto'
        max:
          $ref: '#/components/schemas/MoneyDto'
    LimitedPartnerDto:
      type: object
      properties:
        limitedPartnerId:
          type: string
          example: 11231-47
        limitedPartnerBio:
          $ref: '#/components/schemas/LimitedPartnerBioDto'
