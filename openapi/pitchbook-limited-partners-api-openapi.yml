          $ref: '#/components/schemas/LimitedPartnerTargetAllocationsDto'
        limitedPartnerCommitmentAggregates:
          $ref: '#/components/schemas/LimitedPartnerCommitmentAggregatesDto'
    BulkResultDtoLimitedPartnerDto:
      type: object
      properties:
