openapi: 3.2.0
info:
  title: OpenAPI definition Companies API
  version: v0
  description: Companies
servers:
- url: https://api.pitchbook.com
tags:
- name: Companies
  description: Companies
paths:
  /companies/search:
    get:
      tags:
      - Companies
      summary: Company Search
      description: Retrieves companies matching the specified criteria
      operationId: companySearch
      parameters:
      - name: companyNames
        in: query
        description: Accepts company names, pbIds, websites, and tickers. Returns a list of companies that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: ownershipStatus
        in: query
        description: Companies can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Companies#OWNERSHIP_STATUS_TREE" target="_blank">ownership status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ACQ
      - name: backingStatus
        in: query
        description: Companies can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Companies#BACKING_STATUS_TREE" target="_blank">backing status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ACCIB
      - name: businessStatus
        in: query
        description: Companies can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Companies#BUSINESS_STATUS_TREE" target="_blank">business status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: CH11
      - name: city
        in: query
        description: Search for companies by their city location
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: stateProvince
        in: query
        description: Search for companies by their <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: country
        in: query
        description: Search for companies by their <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: postCode
        in: query
        description: Search for companies by their postcode, included to support searching for both US postal code and foreign
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: locationType
        in: query
        description: Search for companies by additional parameter specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with city, stateProvince, country, postCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: dateFounded
        in: query
        description: 'Companies can be found by founding date. Search for companies founded after a certain date using the > operator, companies founded before a certain date using the < operator and companies founded between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: keywords
        in: query
        description: Search for companies by keywords associated with them or appearing in their business descriptions. If two or more keywords are specified, the OR operator is applied. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IT
      - name: industry
        in: query
        description: Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: verticals
        in: query
        description: Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#VERTICAL_TREE" target="_blank">vertical code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 3D
      - name: industryAndVertical
        in: query
        description: When using any combination of industry, verticals, and emergingSpaces parameters, "OR" logic is used by default. To use "AND" logic, set this parameter to True.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: emergingSpaces
        in: query
        description: Emerging spaces are defined by PB analysts for specific products or technological innovations that are growing in popularity. These spaces are dynamic and change over time. Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#EMERGING_SPACES_TREE" target="_blank">emerging space code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '348'
      - name: gecsSector
        in: query
        description: Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#GECS_SECTOR_TREE" target="_blank">GECS sector code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '102'
      - name: gecsIndustryGroup
        in: query
        description: Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#GECS_INDUSTRY_GROUP_TREE" target="_blank">GECS industry group code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10200'
      - name: gecsIndustry
        in: query
        description: Companies can be found by the <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#GECS_INDUSTRY_TREE" target="_blank">GECS industry code</a>. Only one industry classification can be used at a time. This parameter cannot be combined with parameters from other industry classifications
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10200020'
      - name: dealType
        in: query
        description: Find companies with a specific <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_TYPE_TREE" target="_blank">deal type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: SeedA
      - name: dealStatus
        in: query
        description: Distinguish between failed, upcoming, completed deals and more. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_STATUS_TREE" target="_blank">deal status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANNO
      - name: dealSize
        in: query
        description: Find companies who have had a deal of a certain size. Search for companies with a deal larger than an amount using the > operator, companies with a deal smaller than a certain amount using the < operator and companies with a deal size in a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: includeDealsWithoutDealSize
        in: query
        description: Include companies without a known deal size. Set this parameter as True only when Deal Size parameter is applied. False by default
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: excludeDealsWithoutDealSize
        in: query
        description: Exclude companies without a known deal size. Set this parameter as True only when Deal Size parameter is not applied. False by default
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: dealDate
        in: query
        description: 'Find companies who have had a deal within a certain time frame. Search for companies with a deal after a certain date using the > operator, companies with a deal before a certain date using the < operator and companies with a deal between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: totalRaised
        in: query
        description: Find companies by the total amount of money they have raised to date in millions. Use the > operator to find companies that have raised more than a certain value, use the < to find companies who have raised less than a certain value and the ^ operator to search within a range. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: investorNames
        in: query
        description: Accepts investor names, pbIds, websites, and tickers. Returns a list of companies that have been invested in by specified investors that are an exact match to the input. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: partialExit
        in: query
        description: Find companies who have had a deal with partial investor's exit within them. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: fullExit
        in: query
        description: Find companies who have had a deal with full investor's exit within them. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: exitType
        in: query
        description: Find companies with a specific exit of deal with investor's exit within them. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Deals#EXIT_TYPE_TREE" target="_blank">exit type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: CH11
      - name: exitStatus
        in: query
        description: Distinguish between failed, upcoming, completed exits and more. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_STATUS_TREE" target="_blank">deal status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANNO
      - name: exitSize
        in: query
        description: Find companies who have had a deal with investor's exit within them of a certain size. Search for companies with an exit larger than an amount using the > operator, companies with an exit smaller than a certain amount using the < operator and companies with an exit size in a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: exitDate
        in: query
        description: 'Find companies who have had a deal within a certain time frame. Search for companies with a deal after a certain date using the > operator, companies with a deal before a certain date using the < operator and companies with a deal between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: revenue
        in: query
        description: Find companies that have a certain amount of revenue. Search for companies with more revenue than an amount using the > operator, companies with less revenue than an amount using the < operator or companies within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: onlyMostRecentTransaction
        in: query
        description: Find companies by their most recent deal. To use this parameter set it as True
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 'TRUE'
      - name: employeeCount
        in: query
        description: Find companies by their current employee count. Search for companies with a headcount larger than a value using the > operator, companies with a headcount smaller than a value using the < operator and companies with a headcount in a range using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: totalPatentDocuments
        in: query
        description: Add this parameter to filter based on total patents count. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: activePatentDocuments
        in: query
        description: Add this parameter to filter based on active patents count. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: pendingPatentDocuments
        in: query
        description: Add this parameter to filter based on pending patents count. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: totalPatentFamilies
        in: query
        description: Add this parameter to filter based on patent family count. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: inactiveFamilyDocuments
        in: query
        description: Add this parameter to filter based on inactive documents count. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: patentsExpiringNextYear
        in: query
        description: Add this parameter to filter based on count of patents expiring next year. Use the > operator to indicate a minimum value, the < operator to indicate a maximum value, and a range of two values with the ^ operator.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: patentFilingLocation
        in: query
        description: Patents can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Patents#FILING_LOCATION_TREE" target="_blank">filing location</a>. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: US
      - name: currency
        in: query
        description: Specify the currency that your other parameters, such as dealSize, are entered as. It depends on the <a href="https://my.pitchbook.com/api/lookup-tables/Currency#CURRENCY_CODE_TREE" target="_blank">currency</a> in user preferences
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AFN
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: How many returned results show on page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '402':
          description: Payment Required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdvancedSearchPageDtoCompanyEntityAdvancedSearchResultDto_SearchView'
      security:
      - pbToken: []
