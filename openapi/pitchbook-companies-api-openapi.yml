  /companies/{pbId}/industries:
    get:
      tags:
      - Companies
      summary: Company Industry
      description: Retrieves industries, verticals, keywords, and emerging spaces tagged to the specific company
      operationId: getCompanyIndustry
      parameters:
      - name: pbId
        in: path
        description: Company pbId
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          66153-25:
            summary: 66153-25
            value: 66153-25
          232806-43:
            summary: 232806-43
            value: 232806-43
          137127-16:
            summary: 137127-16
            value: 137127-16
          59191-48:
            summary: 59191-48
