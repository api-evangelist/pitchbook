openapi: 3.2.0
info:
  title: OpenAPI definition Funds API
  version: v0
  description: Funds
servers:
- url: https://api.pitchbook.com
tags:
- name: Funds
  description: Funds
paths:
  /funds/search:
    get:
      tags:
      - Funds
      summary: Fund Search
      description: Retrieves funds along with the investors associated with the fund
      operationId: fundSearch
      parameters:
      - name: fundNames
        in: query
        description: Accepts fund names, and pbIds. Returns a list of funds that are an exact match. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: investorNames
        in: query
        description: Accepts investor names, pbIds, websites, and tickers. Returns a list of funds with the exact matching investor names. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: fundStrategy
        in: query
        description: Funds can be found by their <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STRATEGY" target="_blank">fund strategy code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AN
      - name: dryPowder
        in: query
        description: Find funds that have a certain amount of dry powder. Search for funds with dry powder more than an amount using the > operator, funds with dry powder less than an amount using the < operator or funds with dry powder in a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: fundSize
        in: query
        description: Find funds that have a certain fund size. Search for funds with a larger fund size than an amount using the > operator, funds with a smaller fund size than an amount using the < operator or funds within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: city
        in: query
        description: Search for funds by city of their investors
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: Seattle
      - name: stateProvince
        in: query
        description: Search for funds by <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a> of their investors
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: country
        in: query
        description: Search for funds by <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> of their investors
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: postCode
        in: query
        description: Search for funds by postcodes of their investors
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '98765'
      - name: locationType
        in: query
        description: Search for funds by additional parameter concerning the investors specifying HQ Only (HQ_ONLY), Non-HQ Only (NON_HQ_ONLY) or any office location (ANY) values. Set this parameter in pair with city, stateProvince, country, postCode options
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ANY
      - name: fundDomicileStateProvince
        in: query
        description: Find funds by location of incorporation <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AL
      - name: fundDomicileCountry
        in: query
        description: Find funds by location of incorporation <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: ABW
      - name: vintage
        in: query
        description: Search for funds by vintage year. Search for funds with a vintage after a certain date using the > operator, funds with a vintage before a certain date using the < operator and funds with a vintage between 2 dates using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>2021'
      - name: fundStatus
        in: query
        description: Search for funds by the fund status. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Funds#FUND_STATUS_TREE" target="_blank">fund status code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: CLOS
      - name: fundDate
        in: query
        description: 'Find funds within a certain time frame. Search for a fund after a certain date using the > operator, a fund before a certain date using the < operator and a fund between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: commitmentSize
        in: query
        description: Find funds by the size of individual commitments made to the fund. Search for funds with a commitment larger than an amount using the > operator, funds with a commitment smaller than an amount using the < operator and funds with a commitment between 2 amounts using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: commitmentDate
        in: query
        description: 'Find funds by the date of individual commitments made to the fund. Search for funds with a commitment after a certain date using the > operator, funds with a commitment before a certain date using the < operator and funds with a commitment between 2 dates using the ^ operator. Format: YYYY-MM-DD'
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <2026-09-16
      - name: limitedPartnerNames
        in: query
        description: Search for funds by the exact match of limited partners committed to them. Accepts limited partner names, pbIds, websites, and tickers to return all funds they are invested in. Use a comma to separate multiple values
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 11111-11, Name
      - name: irr
        in: query
        description: Search for funds by their IRR. Find funds with an IRR greater than a certain percentage using the > operator, funds with an IRR smaller than a certain percentage using the < operator and funds between certain percentages using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: dpi
        in: query
        description: Search for funds by their DPI multiple. Find funds with a multiple greater than a value using the > operator, funds with a multiple smaller than a value using the < operator and funds with a multiple between values using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 10^15
      - name: rvpi
        in: query
        description: Search for funds by their RVPI multiple. Find funds with a multiple greater than a value using the > operator, funds with a multiple smaller than a value using the < operator and funds with a multiple between values using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: tvpi
        in: query
        description: Search for funds by their TVPI multiple. Find funds with a multiple greater than a value using the > operator, funds with a multiple smaller than a value using the < operator and funds with a multiple between values using the ^ operator
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: <10
      - name: industryPreferences
        in: query
        description: Find funds by their industry preferences. Pass an <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#INDUSTRY_TREE" target="_blank">industry code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '10'
      - name: verticalsPreferences
        in: query
        description: Find funds by their verticals preferences. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Industries, Verticals & Emerging Spaces#VERTICAL_TREE" target="_blank">vertical code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: 3D
      - name: geographicalPreferences
        in: query
        description: Find funds by their geographical preferences. Pass a <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_STATE_TREE" target="_blank">state code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#US_AREA_TREE" target="_blank">area code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#CANADIAN_PROVINCE_TREE" target="_blank">province code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#UK_TERRITORY_TREE" target="_blank">territory code</a>, <a href="https://my.pitchbook.com/api/lookup-tables/Location#COUNTRY_TREE" target="_blank">country code</a> or <a href="https://my.pitchbook.com/api/lookup-tables/Location#REGION_TREE" target="_blank">regions code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: UK_CI
      - name: additionalPreferences
        in: query
        description: Find funds by <a href="https://my.pitchbook.com/api/lookup-tables/Investors#OTHER_INVESTMENT_PREFERENCES_TREE" target="_blank">additional investment preferences code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: IGPS
      - name: preferredInvestmentAmount
        in: query
        description: Find funds by their preferred investment amount. Search for funds with preferred investment more than an amount using the > operator, funds with preferred investment less than an amount using the < operator or funds with preferred investment within a range using the ^ operator. Amounts in millions
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '>10'
      - name: preferredDealTypes
        in: query
        description: Find funds by their preferred <a href="https://my.pitchbook.com/api/lookup-tables/Deals#DEAL_TYPE_TREE" target="_blank">deal type code</a>
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: SeedA
      - name: currency
        in: query
        description: Specify the currency that your other parameters, such as dealSize, are entered as. It depends on the <a href="https://my.pitchbook.com/api/lookup-tables/Currency#CURRENCY_CODE_TREE" target="_blank">currency</a> in user preferences
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: AFN
      - name: page
        in: query
        description: Results are returned so that they can be paged through. Set this parameter to increment the page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '1'
      - name: perPage
        in: query
        description: How many returned results show on page
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: '25'
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
